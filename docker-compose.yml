services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: www-data
        # Mengirimkan ID user aktif di Linux/Mac Anda secara otomatis
        uid: 1000
        gid: 1000
    container_name: laravelbe_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    mem_limit: 512m
    cpus: 0.75

  web:
    image: nginx:latest
    container_name: laravelbe_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    mem_limit: 256m
    cpus: 0.25

  # ============================================================
  # Reverb - WebSocket server untuk broadcasting real-time.
  # Proses long-running terpisah dari PHP-FPM (app), makanya
  # dibuat sebagai service sendiri, bukan digabung ke "app".
  # Tanpa queue worker: broadcast pakai ShouldBroadcastNow
  # di sisi event, jadi tidak perlu container queue tambahan.
  # ============================================================
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: www-data
        uid: 1000
        gid: 1000
    container_name: laravelbe_reverb
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    # --host=0.0.0.0 wajib supaya bisa diakses dari luar container
    # (default Reverb bind ke 127.0.0.1, cuma bisa diakses dari
    # dalam container itu sendiri)
    command: php artisan reverb:start --host=0.0.0.0 --port=9090
    ports:
      - "9090:9090"
    mem_limit: 256m
    cpus: 0.25

  db:
    image: mysql:8.0
    container_name: laravelbe_db
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=40
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravelbe
    ports:
      - "3309:3306"
    volumes:
      - laravelbe_dbdata:/var/lib/mysql
    mem_limit: 1g
    cpus: 0.75

volumes:
  laravelbe_dbdata: